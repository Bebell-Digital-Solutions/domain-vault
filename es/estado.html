<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Vault | Estado del Sistema</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts: Inter, Orbitron, Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'monospace'],
                        code: ['Fira Code', 'monospace']
                    },
                    colors: {
                        brand: {
                            primary: '#ff5011',
                            bgDark: '#000000',
                            bgDarker: '#050505',
                            bgCard: '#121212',
                            bgHover: '#1a1a1a',
                            success: '#51cf66',
                            warning: '#ffd43b',
                            danger: '#ef4444',
                            textMain: '#f5f5f5',
                            textMuted: '#a0a0a0',
                            border: 'rgba(255, 255, 255, 0.1)'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --primary: #ff5011;
            --bg-dark: #000000;
            --bg-darker: #050505;
            --bg-card: #121212;
            --bg-hover: #1a1a1a;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --success: #51cf66;
            --warning: #ffd43b;
            --danger: #ef4444;
            --shadow-glow: 0 0 30px rgba(255, 80, 17, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Barra de desplazamiento sutil para cuando los bloques se envuelven o el contenedor se encoge */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary); 
        }

        /* Animación de la Barra de Tiempo de Actividad */
        @keyframes blinkOnce {
            0% { background-color: #161616; opacity: 1; filter: brightness(1); }
            30% { filter: brightness(1.5); opacity: 1; }
            100% { opacity: 0.9; }
        }
        
        .animate-blink {
            animation: blinkOnce 0.5s ease-out backwards;
            /* El modo de relleno 'backwards' lo mantiene en #161616 durante el retraso de la animación */
        }

        /* Implementación de tooltip */
        .tooltip-container {
            position: relative;
            display: inline-flex;
        }
        .tooltip-text {
            visibility: hidden;
        }
        
        .animate-equalizer {
            transform-origin: bottom;
            animation: equalizerLoad 0.4s ease-out forwards;
            opacity: 0; /* Comienza oculto, revelado por la animación */
        }

        /* Centrado Forzado para la Superposición del Modal */
        #report-modal.modal-active {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }
        
        #report-modal-content {
            margin: 0 !important; /* Eliminar cualquier margen conflictivo */
        }
    </style>
</head>
<body class="min-h-screen font-sans flex flex-col">

    <!-- El JavaScript inyectará el contenido de la página de estado aquí -->
    <div id="status-page-root" class="flex-grow"></div>

    <!-- Modal de Reportar Problema -->
    <div id="report-modal" class="z-[100] hidden bg-black/80 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="w-full max-w-2xl overflow-hidden rounded-xl bg-white shadow-[0_0_40px_rgba(0,0,0,0.5)] transform scale-95 transition-transform duration-300 flex flex-col" id="report-modal-content">
            
            <!-- Encabezado del Modal: Fondo gris oscuro, texto blanco, 'x' primaria -->
            <div class="flex items-center justify-between bg-brand-bgDarker px-6 py-4 border-b border-brand-border">
                <div class="flex items-center gap-3">
                    <img src="https://bucket.mlcdn.com/a/3336/3336910/images/524bf1f1731bc1e9a78fb265c480b6b1bf1a3e89.png" alt="Domain Vault" class="w-6 h-6 object-contain drop-shadow-[0_0_8px_rgba(255,80,17,0.4)]">
                    <h3 class="text-lg font-semibold text-white">Reportar un Problema</h3>
                </div>
                <button id="close-modal-btn" class="text-brand-primary hover:text-white transition-colors cursor-pointer outline-none">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <!-- Cuerpo del Modal: iframe con fondo blanco -->
            <div class="w-full h-[600px] bg-white relative">
                <iframe src="https://api.helpdesk.icu/form/f031cc6e-e224-3cd1-82e5-5186f4fc27e0" class="w-full h-full border-0 absolute inset-0"></iframe>
            </div>

        </div>
    </div>

    <script>
        /**
- Datos simulados.
- REEMPLAZA ESTO con una llamada `fetch('/api/status')` a tu backend.
         */
        const fetchStatusData = async () => {
            // Retraso de red simulado
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve({
                        overall: {
                            status: 'operational', // 'operational', 'degraded', 'outage'
                            title: "Estamos totalmente operativos",
                            description: "No tenemos conocimiento de ningún problema que afecte a nuestros sistemas."
                        },
                        // Rango de fechas para la ventana de 90 días
                        dateRange: "12 Jul, 2026 - 10 Oct, 2026", 
                        components: [
                            {
                                name: "Aplicación de Panel",
                                uptime: "99.99%",
                                // Array de 90 estados de bloques: 1=Éxito, 2=Advertencia, 3=Peligro
                                blocks: Array(90).fill(1).map((_, i) => i === 45 ? 2 : 1) 
                            },
                            {
                                name: "API de Dominios",
                                uptime: "99.92%",
                                blocks: Array(90).fill(1).map((_, i) => [10, 11, 25].includes(i) ? 3 : (i === 12 ? 2 : 1))
                            },
                            {
                                name: "Consulta WHOIS",
                                uptime: "100%",
                                blocks: Array(90).fill(1)
                            },
                            {
                                name: "Verificación DNS",
                                uptime: "99.95%",
                                blocks: Array(90).fill(1).map((_, i) => i === 80 ? 2 : (i === 81 ? 2 : 1))
                            },
                            {
                                name: "Recordatorios",
                                uptime: "100%",
                                blocks: Array(90).fill(1)
                            }
                        ]
                    });
                }, 100);
            });
        };

        /**
- Genera el HTML para los 90 bloques de actividad.
         */
        const renderBlocks = (blocks) => {
            let html = '';
            blocks.forEach((state, index) => {
                let bgColor = 'bg-brand-success';
                let tooltip = 'Operativo';
                
                if (state === 2) {
                    bgColor = 'bg-brand-warning';
                    tooltip = 'Rendimiento Degradado';
                } else if (state === 3) {
                    bgColor = 'bg-brand-danger';
                    tooltip = 'Interrupción Parcial/Total';
                }

                // Retraso escalonado para el efecto de parpadeo secuencial
                const delay = index * 0.015;

                html += `
                    <div 
                        class="flex-1 h-8 rounded-[1px] ${bgColor} hover:opacity-100 transition-all cursor-pointer animate-blink" 
                        style="animation-delay: ${delay}s;"
                        title="Día ${index + 1}: ${tooltip}">
                    </div>
                `;
            });
            return `<div class="flex gap-[2px] w-full mt-3">${html}</div>`;
        };

        /**
- Genera el HTML para una fila de componente individual.
         */
        const renderComponentRow = (component) => {
            return `
                <div class="p-5 border-b border-brand-border last:border-b-0 hover:bg-brand-hover/50 transition-colors">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-brand-success"></i>
                            <span class="text-base font-medium text-brand-textMain">${component.name}</span>
                            <div class="tooltip-container">
                                <i data-lucide="info" class="w-4 h-4 text-brand-textMuted hover:text-brand-primary cursor-pointer transition-colors"></i>
                                <span class="tooltip-text">Ver datos históricos de ${component.name}</span>
                            </div>
                        </div>
                        
                        <span class="text-sm font-code text-brand-textMuted">${component.uptime} de actividad</span>
                    </div>
                    ${renderBlocks(component.blocks)}
                </div>
            `;
        };

        /**
- Renderiza la interfaz completa de la página de estado.
         */
        const renderApp = (data) => {
            const root = document.getElementById('status-page-root');
            
            // Determinar estilos del banner general según el estado
            const isOperational = data.overall.status === 'operational';
            const bannerBg = isOperational ? 'bg-brand-success/10' : 'bg-brand-warning/10';
            const bannerBorder = isOperational ? 'border-brand-success/30' : 'border-brand-warning/30';
            const bannerTextColor = isOperational ? 'text-brand-success' : 'text-brand-warning';
            const bannerIcon = isOperational ? 'check-circle' : 'alert-triangle';

            const html = `
                <div class="max-w-4xl mx-auto px-4 py-12 w-full">
                    
                    <!-- Encabezado -->
                    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-6">
                        <div class="flex items-center gap-3">
                            <img src="https://bucket.mlcdn.com/a/3336/3336910/images/524bf1f1731bc1e9a78fb265c480b6b1bf1a3e89.png" alt="Domain Vault" class="w-10 h-10 object-contain drop-shadow-[0_0_8px_rgba(255,80,17,0.4)]">
                            <h1 class="text-xl font-tech text-brand-textMain tracking-wide">DOMAIN VAULT</h1>
                        </div>
                        
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <button id="open-report-btn" class="flex-1 sm:flex-none text-center px-4 py-2.5 text-sm font-medium text-brand-textMain bg-brand-bgHover border border-brand-border hover:border-brand-primary hover:text-brand-primary rounded-md transition-all shadow-sm">
                                Reportar un problema
                            </button>
                            <a href="#subscribe" class="flex-1 sm:flex-none text-center px-4 py-2.5 text-sm font-medium text-white bg-brand-primary hover:bg-[#e0460f] transition-colors rounded-md shadow-sm">
                                Suscribirse a actualizaciones
                            </a>
                        </div>
                    </header>

                    <!-- Banner de Estado Principal -->
                    <div class="rounded-lg overflow-hidden mb-8 border ${bannerBorder}">
                        <div class="${bannerBg} p-5 flex items-center gap-3 border-b ${bannerBorder}">
                            <i data-lucide="${bannerIcon}" class="w-6 h-6 ${bannerTextColor}"></i>
                            <span class="font-medium ${bannerTextColor} text-lg">${data.overall.title}</span>
                        </div>
                        <div class="bg-brand-bgDarker p-5 text-brand-textMuted text-sm border-t-0">
                            ${data.overall.description}
                        </div>
                    </div>

                    <!-- Tarjeta de Estado del Sistema -->
                    <div class="rounded-lg border border-brand-border bg-brand-card overflow-hidden shadow-xl mb-10">
                        <!-- Encabezado de la Tarjeta -->
                        <div class="p-5 border-b border-brand-border flex items-center justify-between bg-brand-bgDarker/50">
                            <h2 class="text-lg font-semibold text-brand-textMain">Estado del sistema</h2>
                            <div class="flex items-center gap-2 text-xs text-brand-textMuted font-code">
                                <i data-lucide="chevron-left" class="w-3 h-3 cursor-pointer hover:text-brand-primary transition-colors"></i>
                                <span>${data.dateRange}</span>
                                <i data-lucide="chevron-right" class="w-3 h-3 cursor-pointer hover:text-brand-primary transition-colors"></i>
                            </div>
                        </div>

                        <!-- Lista de Servicios -->
                        <div class="flex flex-col">
                            ${data.components.map(renderComponentRow).join('')}
                        </div>
                    </div>

                    <!-- Acciones del Pie de Página y Marca -->
                    <div class="flex flex-col items-center gap-8 mt-12 pb-8">
                        <button class="flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-brand-textMuted bg-brand-card border border-brand-border hover:border-brand-primary hover:text-brand-textMain rounded-md transition-all group">
                            <i data-lucide="calendar" class="w-4 h-4 group-hover:text-brand-primary transition-colors"></i>
                            Ver historial
                        </button>
                        
                        <div class="flex items-center gap-2 text-sm text-brand-textMuted">
                            Desarrollado por 
                            <a href="/es" class="font-tech text-brand-textMain hover:text-brand-primary hover:drop-shadow-[0_0_5px_rgba(255,80,17,0.5)] transition-all flex items-center gap-2">
                                <img src="https://bucket.mlcdn.com/a/3336/3336910/images/524bf1f1731bc1e9a78fb265c480b6b1bf1a3e89.png" alt="Icono" class="w-4 h-4 object-contain opacity-80">
                                DOMAIN VAULT
                            </a>
                        </div>
                    </div>
                </div>
            `;

            root.innerHTML = html;
            
            // Inicializar iconos Lucide después de renderizar los nuevos elementos HTML
            lucide.createIcons();

            const modal = document.getElementById('report-modal');
            const modalContent = document.getElementById('report-modal-content');
            const openBtn = document.getElementById('open-report-btn');
            const closeBtn = document.getElementById('close-modal-btn');

            const openModal = () => {
                modal.classList.remove('hidden');
                modal.classList.add('modal-active');
                // pequeño retraso para permitir que display:block se aplique antes de animar la opacidad
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                    modalContent.classList.add('scale-100');
                }, 10);
            };

            const closeModal = () => {
                modal.classList.add('opacity-0');
                modalContent.classList.remove('scale-100');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('modal-active');
                }, 300); // coincide con la duración del CSS
            };

            openBtn.addEventListener('click', openModal);
            closeBtn.addEventListener('click', closeModal);
            
            // Cerrar el modal al hacer clic en el fondo
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        };

        /**
- Inicializar la aplicación al cargar el contenido del DOM
         */
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // En un escenario real, esta sería tu llamada a la API:
                // const response = await fetch('/api/status');
                // const data = await response.json();
                
                const data = await fetchStatusData();
                renderApp(data);
            } catch (error) {
                console.error("Error al cargar los datos de estado:", error);
                document.getElementById('status-page-root').innerHTML = `
                    <div class="flex items-center justify-center h-64 text-brand-danger">
                        <p>Error al cargar el estado del sistema. Por favor, inténtalo de nuevo más tarde.</p>
                    </div>
                `;
            }
        });
    </script>



<script>(function(d, s, id){
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = 'https://api.helpdesk.icu/widget2/load?id=98adc241-69bf-34aa-a36e-0ef0f4c866ab&r=' + encodeURIComponent(window.location);
    fjs.parentNode.insertBefore(js, fjs);
}(document, 'script', 'anw2-sdk-QcKtmL9pqjSjbg7w9Mhmqw'));</script>


  
</body>
</html>
