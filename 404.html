    <style>
        /* ===== YOUR ORANGE COLOR PALETTE ===== */
        :root {
            --skin-color: #ff5011;
            --mirage-color: hsl(210, 10%, 23%);
            --title-color: hsl(210, 8%, 95%);
            --text-color: hsl(210, 8%, 85%);
            --body-color: hsl(210, 19%, 5%);
            --box-color: hsl(210, 14%, 10%);
            --scroll-box-color: hsl(210, 12%, 38%);
            --scroll-thumb-color: #ff5011;
            --hue-color: 210;
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--body-color);
            color: var(--text-color);

            align-items: center;
            justify-content: center;

            position: relative;
        }

        /* ===== MATRIX CANVAS ===== */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
		height: 100vh;
            z-index: 0;
            display: block;
            pointer-events: none;
        }





        

        /* ===== CENTERED CARD ===== */
        .card {
            position: relative;
            z-index: 0;
            background: rgba(10, 14, 19, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: .2px solid var(--scroll-box-color);
            border-radius: 2rem;
            padding: 3rem 4rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
        }

        /* ----- CARD HOVER EFFECT (new) ----- */
        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(255, 80, 17, 0.25),
                        0 25px 50px -8px rgba(0, 0, 0, 0.9);
            border-color: var(--skin-color);
        }

        /* ===== TITLE WITH ANIMATED GLOW ===== */
        .card h1 {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            color: var(--skin-color);
            margin-bottom: 0.25rem;
            letter-spacing: -4px;

            /* ----- GLOW ANIMATION (new) ----- */
            animation: glowPulse 2.5s ease-in-out infinite;

        @keyframes glowPulse {
            0% {
                text-shadow: 0 0 20px rgba(255, 80, 17, 0.4),

    <canvas id="canvas"></canvas>




    <div class="card">
    
                   <!-- Top glowing line -->
                <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-transparent via-brand-primary to-transparent z-100"></div>   
    
    
    
        <h1 class="font-tech">404</h1>
        <p class="subtitle font-tech">La página que buscas <span>no existe</span></p>
        <a href="/" class="btn">Volver al Inicio</a>
    </div>
    
    
    
    
    




<script>
	const canvas = document.getElementById("canvas");
	const ctx = canvas.getContext("2d");

	const fontSize = 2;
	const columns = canvas.width / fontSize;
	const drops = new Array(columns).fill(1);
	function draw() {
		ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.fillStyle = "#ff5011";
		ctx.font = fontSize + "px arial";

		for (let i = 0; i < drops.length; i++) {
			const text = String.fromCharCode(Math.floor(Math.random() * 94 + 33));
			ctx.fillText(text, i * fontSize, drops[i] * fontSize);

			if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
				drops[i] = 0;
			}

			drops[i]++;
		}
	}

	setInterval(draw, 33);
</script>



    
</body>
